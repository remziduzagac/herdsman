name: Linux packages

# Turns a release's two Linux binaries into .deb, .rpm and Arch packages, signs
# the .rpm and Arch ones, and attaches all of them to the release. The Release
# workflow calls this; run it by hand to add packages to an earlier release.
# pages.yml then builds the apt, dnf and pacman repositories from them.

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: release version to package, such as 1.0.0
        required: true

permissions:
  contents: write

env:
  NFPM_VERSION: 2.47.0

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install nfpm
        run: |
          archive="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          gh release download "v$NFPM_VERSION" -R goreleaser/nfpm --dir "$RUNNER_TEMP/nfpm" \
            --pattern "$archive" --pattern checksums.txt
          cd "$RUNNER_TEMP/nfpm"
          grep " $archive\$" checksums.txt | sha256sum -c -
          tar xzf "$archive" nfpm
          sudo install -m 755 nfpm /usr/local/bin/nfpm

      - name: Import the signing key
        env:
          PACKAGES_SIGNING_KEY: ${{ secrets.PACKAGES_SIGNING_KEY }}
        run: |
          printf '%s\n' "$PACKAGES_SIGNING_KEY" > "$RUNNER_TEMP/signing-key.asc"
          gpg --batch --quiet --import "$RUNNER_TEMP/signing-key.asc"
          echo "RPM_SIGNING_KEY_FILE=$RUNNER_TEMP/signing-key.asc" >> "$GITHUB_ENV"

      - name: Build the packages
        run: |
          gh release download "v$VERSION" -R "$GITHUB_REPOSITORY" --dir release --pattern 'herdsman-linux-*'
          mkdir -p build dist
          for arch in amd64 arm64; do
            case $arch in amd64) asset=x86_64 ;; arm64) asset=aarch64 ;; esac
            install -m 755 "release/herdsman-linux-$asset" build/herdsman
            for format in deb rpm archlinux; do
              ARCH=$arch nfpm package --config packaging/linux/nfpm.yaml --packager "$format" --target dist/
            done
          done
          # pacman checks a detached signature next to each package.
          for package in dist/*.pkg.tar.zst; do
            gpg --batch --yes --detach-sign --no-armor "$package"
          done
          ls -l dist

      - name: Attach them to the release
        run: gh release upload "v$VERSION" dist/* --clobber -R "$GITHUB_REPOSITORY"

      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/signing-key.asc"
