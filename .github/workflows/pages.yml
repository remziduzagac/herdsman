name: Pages

# Serves what installed copies and the installers fetch, from main's
# distribution/ folder: latest.json, the install scripts, the agent guide, the
# agent-detection catalog and the package signing key. It also builds the
# signed apt, dnf and pacman repositories from the Linux packages attached to
# recent releases, the version file Homebrew installs check, and preview.json
# from the newest preview pre-releases, and the documentation site under
# /docs/, built from docs/next/website. The Release and Preview workflows start
# this when they publish; a push to main that touches distribution/ or the docs
# does too.

on:
  push:
    branches: [main]
    paths:
      - "distribution/**"
      - "docs/next/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Assemble the site
        run: |
          mkdir -p _site/homebrew
          cp distribution/latest.json distribution/install.sh distribution/install.ps1 \
            distribution/install.cmd distribution/agent-guide.md distribution/herdsman.asc _site/
          python3 -c 'import json; v = json.load(open("distribution/latest.json"))["version"]; print(json.dumps({"name": "herdsman", "versions": {"stable": v}}))' \
            > _site/homebrew/herdsman.json
          cp -R distribution/agent-detection _site/agent-detection
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <title>herdsman</title>
          <meta http-equiv="refresh" content="0; url=https://github.com/remziduzagac/herdsman">
          <p><a href="https://github.com/remziduzagac/herdsman">herdsman</a></p>
          EOF

      - name: Build the package repositories
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGES_SIGNING_KEY: ${{ secrets.PACKAGES_SIGNING_KEY }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q createrepo-c
          scripts/package-repos _site

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/next/website/package-lock.json

      - name: Build the documentation
        working-directory: docs/next/website
        run: |
          npm ci --no-audit --no-fund
          npm run build
          mkdir -p "$GITHUB_WORKSPACE/_site/docs"
          cp -R dist/. "$GITHUB_WORKSPACE/_site/docs/"

      - name: Build the preview manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/preview-manifest _site/preview.json

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
