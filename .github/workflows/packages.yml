name: Packages

# Installs the latest herdsman release through every channel the install docs
# list, on clean machines: the install script, the Homebrew tap, mise, the Nix
# flake, and the apt, dnf and pacman repositories. The release workflow starts
# it once the release's Pages deploy is done; it also runs by hand, and after
# other Pages deploys. A Pages deploy in the middle of a release, such as the
# one the release's push to main starts, skips the run: the release is not
# everywhere yet, and the release workflow tests it when it is.

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Pages]
    types: [completed]

permissions:
  contents: read

jobs:
  version:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.latest.outputs.version }}
    steps:
      - id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          tag=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          if [ "$EVENT" = workflow_run ]; then
            newest=$(gh api "repos/$GITHUB_REPOSITORY/tags" --paginate --jq '.[].name' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
            manifest=$(curl -fsSL "https://remziduzagac.github.io/herdsman/latest.json?$(date +%s)" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["version"])')
            if [ "$newest" != "$tag" ] || [ "$manifest" != "${tag#v}" ]; then
              echo "::notice::$newest is still being released (latest release $tag, latest.json $manifest); the release workflow tests it when it is done"
              exit 0
            fi
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  install-script:
    needs: version
    if: needs.version.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Install with install.sh
        run: |
          curl -fsSL https://remziduzagac.github.io/herdsman/install.sh | sh
          "$HOME/.local/bin/herdsman" --version | grep -Fx "herdsman $VERSION"

  homebrew:
    needs: version
    if: needs.version.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Install from the tap
        run: |
          if [ "$RUNNER_OS" = Linux ]; then eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"; fi
          brew install remziduzagac/tap/herdsman
          herdsman --version | grep -Fx "herdsman $VERSION"

  mise:
    needs: version
    if: needs.version.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GITHUB_TOKEN: ${{ github.token }}
      MISE_YES: 1
    steps:
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install: false

      # mise holds back releases younger than a day from "latest", and this runs
      # right after a release, so ask for the version explicitly.
      - name: Install with mise
        run: |
          mise use -g "github:remziduzagac/herdsman@$VERSION"
          mise exec -- herdsman --version | grep -Fx "herdsman $VERSION"

  nix:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build and run the release with Nix
        run: nix run "github:remziduzagac/herdsman/v$VERSION" -- --version | grep -Fx "herdsman $VERSION"

  apt:
    needs: version
    if: needs.version.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:stable', 'ubuntu:latest']
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Install from the apt repository
        run: |
          apt-get update -q && apt-get install -y -q curl ca-certificates
          install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://remziduzagac.github.io/herdsman/herdsman.asc -o /etc/apt/keyrings/herdsman.asc
          echo "deb [signed-by=/etc/apt/keyrings/herdsman.asc] https://remziduzagac.github.io/herdsman/apt stable main" \
            > /etc/apt/sources.list.d/herdsman.list
          apt-get update -q && apt-get install -y -q herdsman
          herdsman --version | grep -Fx "herdsman $VERSION"

  dnf:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    container: fedora:latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Install from the dnf repository
        run: |
          curl -fsSLo /etc/yum.repos.d/herdsman.repo https://remziduzagac.github.io/herdsman/rpm/herdsman.repo
          dnf install -y herdsman
          herdsman --version | grep -Fx "herdsman $VERSION"

  pacman:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Install from the pacman repository
        run: |
          pacman-key --init
          curl -fsSL https://remziduzagac.github.io/herdsman/herdsman.asc | pacman-key --add -
          pacman-key --lsign-key 971C0D3C67E66F3C70BCCBF97E19E7816ABF24EF
          printf '\n[herdsman]\nServer = https://remziduzagac.github.io/herdsman/arch/$arch\n' >> /etc/pacman.conf
          pacman -Sy --noconfirm herdsman
          herdsman --version | grep -Fx "herdsman $VERSION"
