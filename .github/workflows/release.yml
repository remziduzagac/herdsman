name: Release

# A pushed tag vX.Y.Z publishes a release: build the five binaries, create the
# GitHub release with the CHANGELOG.md section as notes, commit the new
# distribution/latest.json to main and dev, redeploy Pages from main, and update
# the formula in the remziduzagac/homebrew-tap repository. linux-packages.yml
# adds the .deb, .rpm and Arch packages that the Pages repositories serve.
#
# Running it by hand rehearses a version instead: everything up to a draft
# release, which stays private until published. Delete the draft afterwards.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: version to rehearse, as in Cargo.toml; builds a private draft release
        required: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      draft: ${{ steps.version.outputs.draft }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Resolve the version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version="${GITHUB_REF_NAME#v}"
            draft=false
          else
            version="$INPUT_VERSION"
            draft=true
          fi
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "$cargo_version" != "$version" ]; then
            echo "::error::version $version doesn't match Cargo.toml version $cargo_version"
            exit 1
          fi
          if [ "$draft" = false ] && ! grep -q "^## \[$version\] - [0-9]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no dated section for $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: herdsman-linux-x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: herdsman-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: herdsman-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: herdsman-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            name: herdsman-windows-x86_64.zip

    runs-on: ${{ matrix.os }}
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
      LIBGHOSTTY_VT_SIMD: 'true'
      RELEASE_VERSION: ${{ needs.check.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Prefer official Ubuntu mirrors over Azure
        if: runner.os == 'Linux'
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt
          fi

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo find /etc/apt/sources.list.d -type f \( -iname '*microsoft*' -o -iname '*azure-cli*' \) -print -delete
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build musl-tools gcc-aarch64-linux-gnu crossbuild-essential-arm64

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja

      - name: Set Linux aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: release-${{ matrix.target }}

      - name: Remove Zig caches
        shell: bash
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package artifact
        if: runner.os != 'Windows'
        shell: bash
        run: cp target/${{ matrix.target }}/release/herdsman ${{ matrix.name }}

      - name: Package artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = Join-Path $env:RUNNER_TEMP "Microsoft.Windows.Console.ConPTY.nupkg"
          $stage = Join-Path $env:RUNNER_TEMP "herdsman-windows-x86_64"
          .\scripts\package_windows_conpty.ps1 `
            -HerdsmanExe target\${{ matrix.target }}\release\herdsman.exe `
            -PackagePath $package `
            -StageDir $stage `
            -OutputPath ${{ matrix.name }}
          $version = (& (Join-Path $stage "herdsman.exe") --version | Out-String).Trim()
          if ($version -notmatch [regex]::Escape($env:RELEASE_VERSION) -or $version -match "preview") {
            throw "Packaged Windows binary has unexpected version identity: $version"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.check.outputs.version }}
      DRAFT: ${{ needs.check.outputs.draft }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Download the binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        run: |
          if [ "$DRAFT" = true ]; then
            tag="v$VERSION-rehearsal.$GITHUB_RUN_NUMBER"
            title="herdsman $VERSION (rehearsal $GITHUB_RUN_NUMBER)"
            python3 scripts/changelog.py extract --version "$VERSION" --output notes.md \
              || echo "Rehearsal build of herdsman $VERSION." > notes.md
            gh release create "$tag" dist/* LICENSE NOTICE --draft --target "$GITHUB_SHA" --title "$title" --notes-file notes.md
          else
            python3 scripts/changelog.py extract --version "$VERSION" --output notes.md
            gh release create "v$VERSION" dist/* LICENSE NOTICE --verify-tag --title "herdsman $VERSION" --notes-file notes.md
          fi

  linux-packages:
    needs: [check, release]
    if: needs.check.outputs.draft == 'false'
    permissions:
      contents: write
    uses: ./.github/workflows/linux-packages.yml
    with:
      version: ${{ needs.check.outputs.version }}
    secrets: inherit

  manifest:
    needs: [check, release, linux-packages]
    if: needs.check.outputs.draft == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Commit the new manifest to main and dev
        run: |
          git merge-base --is-ancestor "v$VERSION" HEAD \
            || { echo "::error::main does not contain v$VERSION; push main before the tag"; exit 1; }
          protocol=$(git show "v$VERSION:src/protocol/wire.rs" | sed -n 's/^pub const PROTOCOL_VERSION: u32 = \([0-9]*\);/\1/p')
          generation=$(git show "v$VERSION:src/protocol/endpoint.rs" | sed -n 's/^pub const ENDPOINT_PROTOCOL_GENERATION: u32 = \([0-9]*\);/\1/p')
          python3 scripts/changelog.py sync-latest-json --version "$VERSION" \
            --protocol "$protocol" --endpoint-generation "$generation"
          # The checked-in stand-in describes no release; keep it out of the history.
          python3 -c 'import json; p = "distribution/latest.json"; d = json.load(open(p)); d.get("releases", {}).pop("0.0.0", None); open(p, "w").write(json.dumps(d, indent=2) + "\n")'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add distribution/latest.json docs/next/product-announcement.json
          git diff --cached --quiet && { echo "manifest already at v$VERSION"; exit 0; }
          git commit -m "release: publish the v$VERSION manifest"
          git push origin HEAD:main
          git push origin HEAD:dev \
            || echo "::warning::dev moved since the release; merge main into dev to pick up the manifest"

      - name: Redeploy Pages from main
        run: gh workflow run pages.yml --ref main

  homebrew:
    needs: [check, manifest]
    if: needs.check.outputs.draft == 'false'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: main
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: remziduzagac/homebrew-tap
          path: tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Update the formula in the tap
        run: |
          manifest=$(python3 -c 'import json; print(json.load(open("distribution/latest.json"))["version"])')
          [ "$manifest" = "$VERSION" ] || { echo "::error::latest.json on main is $manifest, not $VERSION"; exit 1; }
          scripts/homebrew-formula > tap/Formula/herdsman.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/herdsman.rb
          git diff --cached --quiet && { echo "formula already at $VERSION"; exit 0; }
          git commit -m "herdsman $VERSION"
          git push origin HEAD:main
