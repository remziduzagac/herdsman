# Dependency updates, as monthly grouped pull requests into dev. Security
# alerts are on in the repository settings. Rust dependencies are left out on
# purpose: they arrive with each merged base release, as MAINTAINING.md
# explains.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /docs/next/website
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      docs-site:
        patterns:
          - "*"
