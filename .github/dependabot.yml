# Dependency updates, as monthly grouped pull requests into dev. Security
# alerts are on in the repository settings. MAINTAINING.md explains how these
# updates meet the dependencies that arrive with each merged base release.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      cargo-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /docs/next/website
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      docs-site:
        patterns:
          - "*"
